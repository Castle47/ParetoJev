# Active project dataset: complete KuaiRand-27K. Never fall back to Pure/1K.
dataset:
  variant: 27k
  train_logs:
    - log_standard_4_08_to_4_21_27k_part1.csv
    - log_standard_4_08_to_4_21_27k_part2.csv
  validation_test_logs:
    - log_standard_4_22_to_5_08_27k_part1.csv
    - log_standard_4_22_to_5_08_27k_part2.csv
  random_test_log: log_random_4_22_to_5_08_27k.csv
  user_features: user_features_27k.csv
  item_basic_features: video_features_basic_27k.csv
  published_aggregate_features:
    - video_features_statistic_27k_part1.csv
    - video_features_statistic_27k_part2.csv
    - video_features_statistic_27k_part3.csv
  published_aggregates_allowed_as_model_inputs: false
  history_length: 50
  ingestion: chunked_full_dataset_audit
  training_ready: false
slates:
  protocol_name: exposed-session pseudo-slate
  slate_size: 20
  min_slate_size: 5
  session_gap_minutes: 30
  stride: 20
objectives:
  - {name: is_click, direction: 1}
  - {name: long_view, direction: 1}
  - {name: is_like, direction: 1}
  - {name: is_follow, direction: 1}
  - {name: deep_engagement, direction: 1}
  - {name: is_hate, direction: -1}
jev:
  model: autotrust/JEV-27B
  scoring_enabled: false
  readiness: register_language_objectives_and_budget_after_behavior_validation
  modes: [choice, noul]
  history_length: 10
  language_ablations: [zh, translated_en]
evaluation:
  ndcg_k: 10
  bootstrap_samples: 5000
  cold_item_quantile: 0.25
decision_sampling:
  max_slates: 5000
  per_cell: 250
  max_per_user: 2
  seed: 0
  popularity_quantiles: [0.25, 0.75]
  history_buckets:
    short_max: 3
    medium_max: 10
  feedback_buckets:
    positive_rich_threshold: 2
  dimensions: [popularity, history, exposure, feedback_density]
