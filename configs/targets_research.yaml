# Aspirational project gates. These are targets, not achieved results.
# Required provenance for the KuaiRand comparison portion of the combined plan.
# Reports without verified real-data evidence, including all synthetic runs and
# the static checkpoint evaluator, are not_evaluable even if scores clear gates.
evidence_requirements:
  evidence.real_data: true
  evidence.data_kind: real
  evidence.dataset: kuairand
  evidence.protocol_version: baseline-harness-v1
  evidence.comparison_baseline: emer_like
required_methods: [emer_like, cmr_like, paretojev]
targets:
  kuairand_hypervolume_gain_vs_cmr:
    metric: kuairand.paretojev_vs_cmr.hypervolume_relative_gain
    op: ">="
    threshold: 0.02
    required: true
  kuairand_cold_ndcg_gain_vs_cmr:
    metric: kuairand.paretojev_vs_cmr.cold_item_ndcg_relative_gain
    op: ">="
    threshold: 0.03
    required: true
  kuairand_worst_regret_vs_cmr:
    metric: kuairand.paretojev_vs_cmr.worst_objective_regret
    op: "<="
    threshold: 0.005
    required: true
  microlens_auc:
    metric: microlens.hybrid_cv.auc
    op: ">="
    threshold: 0.735
    required: true
    description: Cross-validated hybrid should exceed the strongest published single-system AUC by a meaningful margin.
  microlens_hr5:
    metric: microlens.hybrid_cv.hr@5
    op: ">="
    threshold: 0.600
    required: true
  microlens_ndcg10:
    metric: microlens.hybrid_cv.ndcg@10
    op: ">="
    threshold: 0.510
    required: true
  kuairand_hypervolume_gain:
    metric: kuairand.paretojev.hypervolume_relative_gain
    op: ">="
    threshold: 0.02
    required: true
    description: Main model should improve the multi-objective Pareto hypervolume over EMER-like baseline.
  kuairand_cold_ndcg_gain:
    metric: kuairand.paretojev.cold_item_ndcg_relative_gain
    op: ">="
    threshold: 0.03
    required: true
  kuairand_worst_regret:
    metric: kuairand.paretojev.worst_objective_regret
    op: "<="
    threshold: 0.005
    required: true
  controllability:
    metric: kuairand.paretojev.controllability_spearman_mean
    op: ">="
    threshold: 0.60
    required: true
  student_retention:
    metric: serving.student.uplift_retention
    op: ">="
    threshold: 0.90
    required: true
  serving_p95_ms:
    metric: serving.student.p95_ms_k50
    op: "<="
    threshold: 30.0
    required: true
